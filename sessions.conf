# sessions.conf: the one configuration file of the tools in tools/ and of setup.sh.
#
# Each tool reads this file. Write each path and each name here, not in the tools.
# The form ': "${NAME:=value}"' gives a default value. A value in the environment wins for one run, for example:
#   DISK_MIN_GB_PLAIN=4 tools/unity-lock.sh tools/test-tier.sh quick
# Use $HOME in paths, not the full path of your home folder, so that the file works for each user.

# ---------------------------------------------------------------------------------------------------------------------
# The game
# ---------------------------------------------------------------------------------------------------------------------
: "${GAME_NAME:=My Game}"            # The product name: the name of the Mac app and of the Windows program.
: "${ZIP_NAME:=My-Game}"             # The release zips: <ZIP_NAME>-Windows.zip and <ZIP_NAME>-Mac.zip. No spaces
                                     # (GitHub changes a space in a release file name into a dot).

# ---------------------------------------------------------------------------------------------------------------------
# Unity
# ---------------------------------------------------------------------------------------------------------------------
: "${UNITY_VERSION:=}"               # For setup.sh only, for example 6000.0.58f1. Empty: the Unity CLI selects the
                                     # version. After the setup, the tools read ProjectSettings/ProjectVersion.txt.
: "${UNITY_TEMPLATE:=}"              # For setup.sh only. Empty: the default template of the Unity CLI. To see the names:
                                     # unity templates list
: "${UNITY_CLI:=unity}"              # The Unity CLI command (setup.sh). If it is not on the PATH, give the full path.
: "${UNITY_EDITORS_DIR:=/Applications/Unity/Hub/Editor}"   # The folder of the Editors that the Unity Hub installs.
: "${UNITY_BIN:=}"                   # The Editor binary. Empty: the tools find it from UNITY_EDITORS_DIR and the version.
: "${DOTNET_SDK_DIR:=}"              # For quick-compile.sh. Empty: the DotNetSdk folder of the Editor install (macOS).
: "${UNITY_LOCK:=on}"                # on: each Unity job must go through tools/unity-lock.sh. off: no check (one
                                     # session only on this machine).

# ---------------------------------------------------------------------------------------------------------------------
# Worktrees (docs/disk-and-worktrees.md)
# ---------------------------------------------------------------------------------------------------------------------
: "${WORKTREE_ROOT:=$HOME/UnityProjects}"          # The parent folder of all worktrees.
: "${WORKTREE_PREFIX:=game}"                       # A new worktree is <WORKTREE_ROOT>/<WORKTREE_PREFIX>-<area>.
: "${MAIN_CHECKOUT:=$WORKTREE_ROOT/$WORKTREE_PREFIX-dev}"   # The checkout of the integration branch. It has the
                                                   # Library that the new worktrees clone.
: "${RUNNER_WORKTREE:=$WORKTREE_ROOT/$WORKTREE_PREFIX-qa}"  # The worktree of the Unity runner session.
: "${BASE_BRANCH:=dev}"                            # The integration branch. New branches start from it.
: "${BRANCH_PREFIX:=}"                             # The team prefix of each new branch, for example "alpha/".
: "${CLONE_EXCLUDE:=Temp Logs Builds TestResults obj}"     # Folders that a new worktree does not copy.

# ---------------------------------------------------------------------------------------------------------------------
# The shared notes folder and the Unity runner (docs/unity-runner.md)
# ---------------------------------------------------------------------------------------------------------------------
: "${NOTES_DIR:=$HOME/GameNotes/$WORKTREE_PREFIX}" # Outside all worktrees. It holds runner-worktrees.txt, the queue
                                                   # (unity-runner.md), jobs.log, the briefs, and the reports.
: "${RUNNER_NAME:=the Unity runner session}"       # The name of the runner session in the messages of the tools.
: "${SLOTS_DIR:=${TMPDIR:-/tmp}/$WORKTREE_PREFIX-unity-slots}"   # The lock folder of the two Unity slots.
: "${DISK_MIN_GB_PLAIN:=8}"                        # A plain Unity job waits until the disk has this much free space.
: "${DISK_MIN_GB_EXCLUSIVE:=16}"                   # An exclusive job (a build, a bake) waits for this much.
: "${DISK_MIN_GB_CLONE:=8}"                        # tools/new-worktree.sh refuses below this much free space.

# ---------------------------------------------------------------------------------------------------------------------
# Tests (docs/test-tiers.md)
# ---------------------------------------------------------------------------------------------------------------------
: "${QUICK_COMPILE_ASSEMBLIES:=Game Game.Editor Game.Tests.EditMode Game.Tests.PlayMode}"   # In the order of their
                                                   # references: an assembly comes after the assemblies that it uses.
: "${TIER_QUICK_EXCLUDE:=!Level;!Slow;!Tool;!Visual;!Perf;!Quarantine}"    # PlayMode categories of each tier.
: "${TIER_FULL_EXCLUDE:=!Slow;!Tool;!Visual;!Perf;!Quarantine}"
: "${TIER_NIGHTLY_EXCLUDE:=!Tool;!Quarantine}"
: "${TIER_LIMIT_EDITMODE_MIN:=10}"                 # The watchdog limits in minutes.
: "${TIER_LIMIT_QUICK_MIN:=20}"
: "${TIER_LIMIT_FULL_MIN:=60}"
: "${TIER_LIMIT_NIGHTLY_MIN:=150}"
: "${LOCK_WAIT_MIN:=90}"                           # A batch job waits this long for another Unity process.
: "${HOOK_PATTERN:=\.(cs|asmdef|asmref)$}"         # The pre-commit hook checks a commit with these files.

# ---------------------------------------------------------------------------------------------------------------------
# Players for the bot and network tests (docs/test-tiers.md, section 6)
# ---------------------------------------------------------------------------------------------------------------------
: "${DEV_PLAYER_DIR:=Builds/Dev/Mac}"              # Relative to the project folder.
: "${DEV_PLAYER:=$DEV_PLAYER_DIR/$GAME_NAME.app/Contents/MacOS/$GAME_NAME}"   # The executable of the development player.
: "${BUILD_METHOD_DEV_MAC:=BuildTools.BuildDevMac}"
: "${BOT_TIMEOUT_MIN:=30}"
: "${NET_MEMORY_GROWTH_MB_MAX:=1024}"              # The memory of each player may grow this much in a long run.

# ---------------------------------------------------------------------------------------------------------------------
# Releases (docs/release-rules.md)
# ---------------------------------------------------------------------------------------------------------------------
: "${RELEASE_DIR:=Builds/Release}"                 # Relative to the project folder.
: "${RELEASE_TAG_PREFIX:=test}"                    # The tag of a release: <prefix>-<date>-<commit>.
: "${RELEASE_MAX_BYTES:=2147483648}"               # GitHub takes less than 2 GiB for one release file.
: "${BUILD_METHOD_WINDOWS:=BuildTools.BuildWindows}"
: "${BUILD_METHOD_MAC:=BuildTools.BuildMac}"
: "${RELEASE_RESTORE_FILES:=ProjectSettings/ProjectSettings.asset}"   # Files that a build changes and that you never
                                                   # commit. The release script puts them back (space-separated list).
: "${RELEASE_VERIFY_DOWNLOAD:=1}"                  # 1: after the upload, download each file and compare its SHA-256.
